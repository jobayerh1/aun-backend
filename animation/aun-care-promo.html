<title>AUN Care — Promo Animation</title>
<style>
/* Committed single visual world: a projection room, night or day. */
:root{
  --ink:#05080F;
  --beam:#0188FE;
  --beam-soft:#6FB6FF;
  --paper:#EDF2FA;
  --mute:#8892A6;
  --line:#223146;
  --panel:#0D1522;
  --display:"Segoe UI Semibold","Segoe UI","Nirmala UI",system-ui,sans-serif;
  --body:"Segoe UI","Nirmala UI",system-ui,sans-serif;
  --util:Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--paper); font-family:var(--body);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  gap:20px; padding:24px 16px 44px;
}

.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
  font-family:var(--util); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase}
.bar span{color:var(--mute); margin:0 2px 0 8px}
.bar span:first-child{margin-left:0}
.bar button{font:inherit; color:var(--paper); background:var(--panel);
  border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer}
.bar button:hover{border-color:var(--beam)}
.bar button[aria-pressed="true"]{background:var(--beam); border-color:var(--beam); color:#04121F}
.bar button:focus-visible{outline:2px solid var(--beam-soft); outline-offset:2px}

/* ---------- stage ---------- */
.stage{
  position:relative; overflow:hidden; isolation:isolate;
  width:min(540px,92vw); aspect-ratio:1/1; border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(12px,3vw,20px); padding:5% 6% 4%;
  perspective:1400px; perspective-origin:50% 45%;
  /* NOTE: a 3D layer rasterises at its CSS size, so this page must be
     EXPORTED VIA CSS ZOOM (see render.py), never via deviceScaleFactor —
     otherwise the phone is drawn small and upscaled, and the UI goes to mush. */
  --room:radial-gradient(125% 95% at 50% 4%, #17263F 0%, #0A101C 46%, #04070D 100%);
  --cap:#EDF2FA; --cap-sub:#6FB6FF; --cap-shadow:0 2px 18px rgba(0,0,0,.8);
  --vig:radial-gradient(80% 70% at 50% 40%, transparent 52%, rgba(2,4,9,.88) 100%);
  --beam-a:.22; --beam-b:.07; --grain:.30; --mote:.55; --spill:.55;
  background:var(--room);
}
.stage[data-mood="day"]{
  --room:radial-gradient(120% 100% at 50% 0%, #FFFFFF 0%, #E7EFFA 45%, #CBDCF0 100%);
  --cap:#0E2036; --cap-sub:#0B6FCB; --cap-shadow:none;
  --vig:radial-gradient(85% 80% at 50% 40%, transparent 60%, rgba(150,178,208,.35) 100%);
  --beam-a:.16; --beam-b:.05; --grain:.10; --mote:.20; --spill:.30;
}
.stage[data-ar="9:16"]{aspect-ratio:9/16; width:min(348px,74vw)}
.stage[data-ar="16:9"]{aspect-ratio:16/9; width:min(760px,94vw); flex-direction:row; gap:5%; padding:6% 7%}

.beam{position:absolute; inset:-32% -12% auto -12%; height:155%; z-index:0; filter:blur(20px);
  background:conic-gradient(from 200deg at 50% 0%, transparent 0deg,
    rgba(1,136,254,var(--beam-a)) 13deg, rgba(111,182,255,var(--beam-b)) 27deg, transparent 41deg);}

/* light thrown from the screen onto the room behind the phone */
.spill{position:absolute; left:50%; top:44%; width:120%; aspect-ratio:1; z-index:1;
  transform:translate(-50%,-50%); pointer-events:none; opacity:var(--spill);
  background:radial-gradient(closest-side, rgba(120,185,255,.30), rgba(80,150,255,.10) 45%, transparent 72%);
  filter:blur(26px)}

/* dust motes drifting in the beam — gives the air some depth */
.motes{position:absolute; inset:0; z-index:1; pointer-events:none; opacity:var(--mote)}
.mote{position:absolute; border-radius:50%; background:radial-gradient(circle,#CFE6FF,rgba(207,230,255,0) 70%)}

.grain{position:absolute; inset:0; z-index:6; pointer-events:none; opacity:var(--grain); mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.11) .5px, transparent .6px); background-size:3px 3px}
.vig{position:absolute; inset:0; z-index:7; pointer-events:none; background:var(--vig)}

/* ---------- phone ---------- */
.phone{
  position:relative; z-index:2; padding:7px; border-radius:32px;
  flex:1 1 auto; min-height:0; max-height:470px; width:auto; aspect-ratio:1080/2424;
  transform-style:preserve-3d;
  background:
    linear-gradient(160deg,#4A5C78 0%,#222C3D 26%,#121A27 62%,#0A101A 100%);
  box-shadow:
    0 0 0 1px rgba(150,175,205,.55),
    0 1px 0 0 rgba(255,255,255,.28) inset,
    0 30px 70px rgba(0,0,0,.6),
    0 0 110px rgba(1,136,254,.32);
}
.stage[data-mood="day"] .phone{
  box-shadow:
    0 0 0 1px rgba(120,145,175,.7),
    0 1px 0 0 rgba(255,255,255,.5) inset,
    0 28px 60px rgba(40,70,110,.34),
    0 0 90px rgba(1,136,254,.22);
}
.stage[data-ar="16:9"] .phone{flex:0 0 auto; height:min(100%,400px); max-height:none}

/* side buttons */
.phone::before, .phone::after{
  content:""; position:absolute; right:-2px; width:2px; border-radius:2px;
  background:linear-gradient(#5A6C88,#2B3648);
}
.phone::before{top:22%; height:7%}
.phone::after{top:32%; height:11%}

.screen{position:relative; overflow:hidden; border-radius:26px; background:#EDF4FB; height:100%}

/* glass sheen sweeping across the screen */
.gloss{
  position:absolute; inset:-30%; z-index:5; pointer-events:none; opacity:0;
  background:linear-gradient(102deg, transparent 38%, rgba(255,255,255,.42) 50%, transparent 62%);
}

.view{position:absolute; inset:0; opacity:0}
.view img{display:block; width:100%; height:auto}
.chrome-top{position:absolute; top:0; left:0; right:0; z-index:4}
.chrome-nav{position:absolute; bottom:0; left:0; right:0; z-index:4}
.port{position:absolute; left:0; right:0; overflow:hidden}
.track{position:absolute; top:0; left:0; width:100%; will-change:transform}
.track img{display:block; width:100%}
.port::after{content:""; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 8px 10px -8px rgba(120,150,190,.35), inset 0 -8px 10px -8px rgba(120,150,190,.35)}
.track .layer2{position:absolute; top:0; left:0; opacity:0}   /* Help tab over Firmware */
.full{position:absolute; inset:0}
.full img{width:100%}

/* tap ripple that lands on the Help tab */
.tap{position:absolute; left:68.2%; top:30.2%; width:16%; aspect-ratio:1; z-index:3;
  transform:translate(-50%,-50%) scale(0); opacity:0; border-radius:50%;
  border:1.5px solid rgba(1,136,254,.9); background:rgba(1,136,254,.14)}

.spin{
  /* matches the erased spinner: centre 543.5,1495 · d 76 of 1080x2424 */
  position:absolute; left:50.32%; top:61.68%; width:7.05%; aspect-ratio:1;
  transform:translate(-50%,-50%); border-radius:50%;
  border:0.9% solid transparent; border-top-color:#3E5F90; border-right-color:#3E5F90;
  animation:spin 1s linear infinite; z-index:3;
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- caption block ---------- */
.caption{
  position:relative; z-index:5; flex:0 0 auto; width:100%;
  display:grid; place-items:center; text-align:center;
  min-height:3.6em; padding-bottom:.2em;
}
.stage[data-ar="16:9"] .caption{flex:0 1 auto; min-height:0; text-align:left;
  place-items:center start; max-width:46%}
.caption p{
  grid-area:1/1; margin:0; opacity:0; color:var(--cap); font-family:var(--display);
  font-size:clamp(13.5px,3.5vw,20px); letter-spacing:-.015em; line-height:1.3;
  text-wrap:balance; text-shadow:var(--cap-shadow);
}
.caption .w{display:inline-block; will-change:transform,opacity}
.stage[data-ar="16:9"] .caption p{font-size:clamp(16px,2.5vw,26px)}
.caption small{
  display:block; margin-top:8px; font-family:var(--util); font-size:9.5px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--cap-sub); text-shadow:none;
}
.note{max-width:64ch; font-size:13.5px; line-height:1.6; color:var(--mute); text-align:center}
.note b{color:var(--paper); font-weight:600}
</style>

<div class="bar">
  <span>Frame</span>
  <button data-ar="1:1" aria-pressed="true">1:1 Feed</button>
  <button data-ar="9:16" aria-pressed="false">9:16 Reel</button>
  <button data-ar="16:9" aria-pressed="false">16:9 YouTube</button>
  <span>Room</span>
  <button data-mood="night" aria-pressed="true">Night</button>
  <button data-mood="day" aria-pressed="false">Day</button>
  <span>Text</span>
  <button data-lang="en" aria-pressed="true">English</button>
  <button data-lang="bn" aria-pressed="false">বাংলা</button>
  <button id="replay" style="margin-left:8px">Replay</button>
  <button id="big">Fullscreen</button>
</div>

<!-- Fullscreen: scales the layout (zoom, not transform) so the phone
     re-rasterises at the larger size and stays sharp for screen recording. -->
<style>
body.big > *:not(#bigwrap){display:none !important}
#bigwrap{display:none}
body.big #bigwrap{
  display:flex; position:fixed; inset:0; z-index:99;
  align-items:center; justify-content:center; background:#000;
}
body.big #bigwrap .stage{border-radius:0}
#exit{position:fixed; right:14px; top:14px; z-index:100; font-family:var(--util);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#fff;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
  border-radius:999px; padding:7px 14px; cursor:pointer; display:none}
body.big #exit{display:block}
#exit:hover{background:rgba(255,255,255,.22)}
</style>
<div id="bigwrap"></div>
<button id="exit">Exit fullscreen (Esc)</button>

<p class="note">A 20-second seamless loop built from real app screens. Pick a frame, room and language, then <b>screen-record the stage</b> — or use the rendered MP4s.</p>

<script>
(function(){
  const stage = document.getElementById('stage');

  const COPY = {
    en: {
      c0:'AUN Care',
      c1:'Every repair and parts order, live',
      c2:'Even what to watch tonight',
      c3:'Scan the barcode once.<br>Your warranty is sorted.',
      c4:'Firmware, manuals, videos and help<br>for your exact model',
      c5:'Ask in the app.<br>No phone calls, nothing forgotten.',
      c6:'Most brands sell you a box.<br>AUN stays after the sale.<small>aun-projector.com.bd</small>'
    },
    bn: {
      c0:'AUN Care',
      c1:'প্রতিটি রিপেয়ার আর পার্টস অর্ডার — লাইভ',
      c2:'আজ রাতে কী দেখবেন, সেটাও',
      c3:'একবার বারকোড স্ক্যান করুন।<br>ওয়ারেন্টি নিশ্চিত।',
      c4:'আপনার মডেলের ফার্মওয়্যার, ম্যানুয়াল,<br>ভিডিও আর হেল্প',
      c5:'অ্যাপেই জিজ্ঞেস করুন।<br>ফোন করার দরকার নেই।',
      c6:'অন্যরা শুধু বক্স বিক্রি করে।<br>AUN বিক্রির পরেও পাশে থাকে।<small>aun-projector.com.bd</small>'
    }
  };

  /* wrap every word in a span so captions can reveal word by word */
  function splitWords(el){
    const walk = node => {
      [...node.childNodes].forEach(n => {
        if(n.nodeType === 3){
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if(!part.trim()){ frag.appendChild(document.createTextNode(part)); return; }
            const s = document.createElement('span');
            s.className = 'w'; s.textContent = part;
            frag.appendChild(s);
          });
          n.replaceWith(frag);
        } else if(n.nodeType === 1 && n.tagName !== 'BR'){
          walk(n);
        }
      });
    };
    walk(el);
  }
  function setLang(l){
    const t = COPY[l];
    for(const id in t){
      const el = document.getElementById(id);
      el.innerHTML = t[id];
      splitWords(el);
    }
  }
  setLang('en');

  /* drifting dust motes */
  const motes = document.getElementById('motes');
  const MOTES = [];
  for(let i = 0; i < 16; i++){
    const m = document.createElement('span');
    m.className = 'mote';
    const size = 2 + Math.random() * 4;
    m.style.width = size + 'px'; m.style.height = size + 'px';
    m.style.left = (Math.random() * 100) + '%';
    m.style.top  = (Math.random() * 100) + '%';
    motes.appendChild(m); MOTES.push(m);
  }

  document.querySelectorAll('.bar button[data-ar], .bar button[data-mood], .bar button[data-lang]').forEach(b=>{
    const key = b.dataset.ar ? 'ar' : (b.dataset.mood ? 'mood' : 'lang');
    b.addEventListener('click',()=>{
      document.querySelectorAll(`.bar button[data-${key}]`).forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      stage.dataset[key] = b.dataset[key];
      if(key === 'lang') setLang(b.dataset.lang);
      requestAnimationFrame(()=>requestAnimationFrame(run));
    });
  });

  const TOP_H = 0.05391, NAV_H = 0.08801;
  function layout(){
    const sh = document.querySelector('.screen').clientHeight;
    document.querySelectorAll('[data-port]').forEach(p=>{
      const nav = p.hasAttribute('data-nonav') ? 0 : NAV_H;
      p.style.top = (sh*TOP_H)+'px';
      p.style.height = (sh*(1-TOP_H-nav))+'px';
    });
  }

  // Easing belongs on individual keyframes — a top-level easing warps the
  // whole timeline and every cue lands at the wrong moment.
  const D = 20000, ease = 'cubic-bezier(.4,0,.2,1)';
  const spring = 'cubic-bezier(.22,1.2,.36,1)';
  const at = t => Math.min(1, Math.max(0, t/D));
  const anims = [];
  const A = (el, kf, opt={}) =>
    anims.push(el.animate(kf, Object.assign({duration:D, iterations:Infinity, easing:'linear'}, opt)));

  function run(){
    anims.forEach(a=>a.cancel()); anims.length = 0;
    layout();

    A(document.getElementById('beam'), [
      {transform:'rotate(-9deg) scale(1.05)', opacity:.55},
      {transform:'rotate(9deg) scale(1.13)',  opacity:.95, offset:.6},
      {transform:'rotate(-9deg) scale(1.05)', opacity:.55}
    ]);

    // the phone drifts in 3D — a slow parallax turn gives the shot depth
    A(document.getElementById('phone'), [
      {opacity:0, transform:'translateY(26px) translateZ(-90px) rotateY(-13deg) rotateX(5deg) scale(.97)',
       easing:spring},
      {opacity:1, transform:'translateY(0) translateZ(0) rotateY(-7deg) rotateX(2.2deg) scale(1)',
       offset:.075, easing:'ease-in-out'},
      {transform:'translateY(-6px) translateZ(26px) rotateY(3deg) rotateX(-1deg) scale(1.01)',
       offset:.52, easing:'ease-in-out'},
      {opacity:1, transform:'translateY(0) translateZ(0) rotateY(8deg) rotateX(1.5deg) scale(1)',
       offset:.965, easing:'cubic-bezier(.4,0,1,1)'},
      {opacity:0, transform:'translateY(26px) translateZ(-90px) rotateY(13deg) rotateX(5deg) scale(.97)'}
    ]);

    // screen light spilling onto the room, brighter on the bright scenes
    A(document.getElementById('spill'), [
      {opacity:0, transform:'translate(-50%,-50%) scale(.82)'},
      {opacity:.85, transform:'translate(-50%,-50%) scale(1)', offset:.09, easing:'ease-in-out'},
      {opacity:1, transform:'translate(-50%,-50%) scale(1.06)', offset:.5, easing:'ease-in-out'},
      {opacity:.9, transform:'translate(-50%,-50%) scale(1)', offset:.95},
      {opacity:0, transform:'translate(-50%,-50%) scale(.82)'}
    ]);

    MOTES.forEach((m,i)=>{
      const dx = (i%2?1:-1) * (14 + (i*7)%26);
      const dy = -(30 + (i*13)%70);
      A(m, [
        {transform:'translate(0,0)', opacity:0},
        {opacity:.5 + (i%5)*.1, offset:.12},
        {opacity:.35 + (i%4)*.12, offset:.7},
        {transform:`translate(${dx}px,${dy}px)`, opacity:0}
      ], {delay:-(i*900)%D});
    });

    const scenes = [
      ['v-splash',      0,  2000],
      ['v-home',     2000,  8000],
      ['v-devices',  8000, 10000],
      ['v-detail',  10000, 14000],
      ['v-support', 14000, 20000]
    ];
    const F = 320;
    scenes.forEach(([id,a,b])=>{
      A(document.getElementById(id), [
        {opacity:0, transform:'scale(1.018)', offset:0},
        {opacity:0, transform:'scale(1.018)', offset:at(a-F), easing:ease},
        {opacity:1, transform:'none',         offset:at(a+F)},
        {opacity:1, transform:'none',         offset:at(b-F), easing:ease},
        {opacity:0, transform:'scale(.99)',   offset:at(b+F)},
        {opacity:0, transform:'scale(1.018)', offset:1}
      ]);
    });

    // sheen sweep on each scene change
    const gl = [{opacity:0, transform:'translateX(-70%)', offset:0}];
    [2000, 8000, 10000, 14000].forEach(c=>{
      gl.push({opacity:0, transform:'translateX(-70%)', offset:at(c-120)});
      gl.push({opacity:.55, transform:'translateX(-10%)', offset:at(c+180), easing:'ease-out'});
      gl.push({opacity:0, transform:'translateX(70%)', offset:at(c+620)});
    });
    gl.push({opacity:0, transform:'translateX(-70%)', offset:1});
    A(document.getElementById('gloss'), gl);

    const scroll = (viewId, a, b) => {
      const view = document.getElementById(viewId);
      const port = view.querySelector('[data-port]');
      const trk  = view.querySelector('.track');
      const dist = Math.max(0, trk.clientHeight - port.clientHeight);
      if(!dist) return;
      A(trk, [
        {transform:'translateY(0)',          offset:0},
        {transform:'translateY(0)',          offset:at(a), easing:'cubic-bezier(.45,.05,.35,1)'},
        {transform:`translateY(${-dist}px)`, offset:at(b)},
        {transform:`translateY(${-dist}px)`, offset:1}
      ]);
    };
    scroll('v-home',    2300, 6400);
    scroll('v-support', 14400, 18600);

    // tap the Help tab, then the content switches under it
    A(document.getElementById('tap'), [
      {opacity:0, transform:'translate(-50%,-50%) scale(.2)', offset:0},
      {opacity:0, transform:'translate(-50%,-50%) scale(.2)', offset:at(11550)},
      {opacity:.95, transform:'translate(-50%,-50%) scale(.55)', offset:at(11720), easing:'ease-out'},
      {opacity:0, transform:'translate(-50%,-50%) scale(1.5)', offset:at(12250)},
      {opacity:0, transform:'translate(-50%,-50%) scale(.2)', offset:1}
    ]);
    A(document.getElementById('detail-help'), [
      {opacity:0, offset:0},
      {opacity:0, offset:at(11850), easing:ease},
      {opacity:1, offset:at(12220)},
      {opacity:1, offset:1}
    ]);

    // captions reveal word by word
    const CAPS = [['c0',0,2000],['c1',2000,5000],['c2',5000,8000],['c3',8000,10000],
                  ['c4',10000,14000],['c5',14000,17000],['c6',17000,20000]];
    CAPS.forEach(([id,a,b])=>{
      const p = document.getElementById(id);
      A(p, [
        {opacity:0, offset:0},
        {opacity:0, offset:at(a-1)},
        {opacity:1, offset:at(a+60)},
        {opacity:1, offset:at(b-360), easing:ease},
        {opacity:0, offset:at(b)},
        {opacity:0, offset:1}
      ]);
      const words = p.querySelectorAll('.w');
      words.forEach((w,i)=>{
        const t0 = a + i*55;
        A(w, [
          {opacity:0, transform:'translateY(9px)', filter:'blur(4px)', offset:0},
          {opacity:0, transform:'translateY(9px)', filter:'blur(4px)', offset:at(t0), easing:spring},
          {opacity:1, transform:'none', filter:'blur(0px)', offset:at(t0+420)},
          {opacity:1, transform:'none', filter:'blur(0px)', offset:at(b-360), easing:ease},
          {opacity:0, transform:'translateY(-7px)', filter:'blur(2px)', offset:at(b)},
          {opacity:0, transform:'translateY(9px)', filter:'blur(4px)', offset:1}
        ]);
      });
    });
  }

  /* ---- fullscreen preview (for screen recording) ---- */
  const wrap = document.getElementById('bigwrap');
  const home = stage.parentNode, next = stage.nextSibling;
  function fitBig(){
    const w = stage.getBoundingClientRect().width / (parseFloat(stage.style.zoom) || 1);
    const h = stage.getBoundingClientRect().height / (parseFloat(stage.style.zoom) || 1);
    stage.style.zoom = Math.min(window.innerWidth / w, window.innerHeight / h);
    requestAnimationFrame(run);
  }
  function enterBig(){
    stage.style.zoom = 1;
    wrap.appendChild(stage);
    document.body.classList.add('big');
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    requestAnimationFrame(fitBig);
  }
  function exitBig(){
    stage.style.zoom = 1;
    home.insertBefore(stage, next);
    document.body.classList.remove('big');
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    requestAnimationFrame(run);
  }
  document.getElementById('big').addEventListener('click', enterBig);
  document.getElementById('exit').addEventListener('click', exitBig);
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && document.body.classList.contains('big')) exitBig(); });
  window.addEventListener('resize', ()=>{ if(document.body.classList.contains('big')) fitBig(); });

  document.getElementById('replay').addEventListener('click', run);
  let rt; window.addEventListener('resize', ()=>{clearTimeout(rt); rt = setTimeout(run, 150);});

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    layout();
    document.getElementById('v-home').style.opacity = 1;
    document.getElementById('c1').style.opacity = 1;
  } else if(document.readyState === 'complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>
