<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>AUN 5% offer</title>
<style>
  :root { --blue: #0188fe; --cyan: #00c6ff; --gold: #ffbc00; --gold2: #ffd34d; --ink: #fff; --muted: #b9cbe0; --k: 1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: #040913; }
  body { font-family: 'Nirmala UI', 'Segoe UI', sans-serif; color: var(--ink); position: relative; }
  .abs { position: absolute; }
  .lat { font-family: 'Segoe UI', sans-serif; }

  /* ---------- room ---------- */
  .room { inset: 0; background:
      radial-gradient(90% 55% at 50% 38%, #0d1f3d 0%, #070f20 55%, #040913 100%); }
  .ambient { inset: 0; opacity: 0; background:
      radial-gradient(70% 40% at 50% var(--glowY), rgba(1,136,254,.38), rgba(1,136,254,0) 70%),
      radial-gradient(50% 18% at 50% 100%, rgba(0,198,255,.18), rgba(0,198,255,0) 70%);
      animation: fadeIn 1s ease-out 1.1s both; }
  .vignette { inset: 0; background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  .logo { left: 50%; height: var(--logoH); transform: translateX(-50%); top: var(--logoY);
          animation: logoIn .7s cubic-bezier(.2,.8,.2,1) .15s both; }

  /* ---------- projector + beam ---------- */
  .proj { left: 50%; width: var(--projW); top: var(--projY); transform: translateX(-50%);
          filter: drop-shadow(0 30px 40px rgba(0,0,0,.7));
          animation: projIn .9s cubic-bezier(.2,.8,.2,1) .2s both; }
  .beam, .beamCore { inset: 0; opacity: 0; mix-blend-mode: screen; filter: blur(10px); }
  .beam { background: linear-gradient(to top, rgba(190,225,255,.75) 0%, rgba(110,185,255,.30) 35%, rgba(70,150,255,.08) 100%);
          animation: flick .55s linear 1.0s both, breathe 2.6s ease-in-out 1.6s infinite; }
  .beamCore { filter: blur(16px);
          background: linear-gradient(to top, rgba(255,255,255,.85) 0%, rgba(200,235,255,.25) 30%, rgba(200,235,255,0) 70%);
          animation: flick .55s linear 1.0s both; }
  .lens { width: 150px; height: 70px; border-radius: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0;
          background: radial-gradient(closest-side, #fff, rgba(170,220,255,.8) 40%, rgba(1,136,254,0));
          filter: blur(4px); animation: flick .55s linear 1.0s both; }
  .motes { inset: 0; opacity: 0; animation: fadeIn 1.2s ease-out 1.3s both; }
  .mote { border-radius: 50%; background: #dff1ff; box-shadow: 0 0 6px rgba(190,230,255,.9); }

  /* ---------- screen ---------- */
  .screen { border-radius: 26px; overflow: hidden; background: #0b1324;
            box-shadow: 0 0 0 2px rgba(255,255,255,.06); }
  .screenOn { inset: 0; opacity: 0; border-radius: 26px;
      background: radial-gradient(120% 85% at 50% 22%, #1660bf 0%, #0b3778 38%, #071d44 72%, #061532 100%);
      box-shadow: inset 0 0 0 2px rgba(160,215,255,.55), inset 0 0 140px rgba(255,255,255,.07);
      animation: flick .55s linear 1.05s both; }
  .screenGlow { opacity: 0; border-radius: 30px; box-shadow: 0 0 90px rgba(1,136,254,.65), 0 0 220px rgba(1,136,254,.25);
      animation: flick .55s linear 1.05s both; }
  .grain { inset: 0; opacity: .07; background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.2px); background-size: 5px 5px; }
  .glare { inset: -20% -60%; opacity: 0;
      background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.22) 50%, transparent 58%);
      animation: glare 1.1s ease-in-out 1.35s both; }

  .scene { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { font-size: calc(44px * var(--k)); font-weight: 700; padding: calc(10px * var(--k)) calc(30px * var(--k)); border-radius: 999px;
          background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28); }

  /* scene A: the offer */
  #sA { animation: sceneOut .45s ease-in 4.55s forwards; }
  #sA .pill { animation: up .5s cubic-bezier(.2,.8,.2,1) 1.5s both; }
  .pctWrap { position: relative; margin-top: calc(6px * var(--k)); animation: pop .8s cubic-bezier(.34,1.56,.64,1) 1.65s both; }
  .pct { font-weight: 700; font-size: calc(330px * var(--k)); line-height: 1.2; display: flex; align-items: flex-start; }
  .gold { background: linear-gradient(180deg, #fff7d6 0%, #ffd34d 42%, #ffad00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .goldGlow { filter: drop-shadow(0 0 calc(34px * var(--k)) rgba(255,188,0,.5)); }
  .roll { display: inline-block; height: 1.2em; overflow: hidden; }
  .roll .col { display: flex; flex-direction: column; animation: roll 1.05s cubic-bezier(.15,.85,.25,1) 1.7s both; }
  .roll .col span { height: 1.2em; line-height: 1.2; display: block; }
  .shine { inset: 0; display: flex; align-items: flex-start; justify-content: center; font-weight: 700; font-size: calc(330px * var(--k)); line-height: 1.2;
           color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 320% 100%;
           background-image: linear-gradient(105deg, transparent 0 42%, rgba(255,255,255,.95) 50%, transparent 58% 100%);
           animation: shine 1s ease-in-out 3.2s both; }
  .off { font-weight: 700; font-size: calc(132px * var(--k)); line-height: 1.1; margin-top: calc(-30px * var(--k));
         animation: up .55s cubic-bezier(.34,1.56,.64,1) 2.55s both; }
  .limited { margin-top: calc(26px * var(--k)); font-size: calc(38px * var(--k)); font-weight: 700; color: #071633;
             background: linear-gradient(90deg, #ffd34d, #ffbc00); padding: calc(10px * var(--k)) calc(28px * var(--k)); border-radius: 12px;
             animation: up .5s cubic-bezier(.2,.8,.2,1) 2.95s both; }

  /* scene B: dates + coupon */
  #sB { opacity: 0; animation: sceneIn .5s cubic-bezier(.2,.8,.2,1) 5.0s both, sceneOut .45s ease-in 8.05s forwards; }
  #sB .eyebrow { font-size: calc(48px * var(--k)); color: var(--muted); font-weight: 700; animation: up .5s ease-out 5.05s both; }
  .dates { font-weight: 700; line-height: 1.15; animation: pop .7s cubic-bezier(.34,1.56,.64,1) 5.2s both; }
  .dates .d { font-size: calc(190px * var(--k)); }
  .dates .m { font-size: calc(96px * var(--k)); display: block; margin-top: calc(-14px * var(--k)); }
  .days { font-size: calc(46px * var(--k)); color: var(--muted); margin-top: calc(8px * var(--k)); animation: up .5s ease-out 5.55s both; }
  .coupon { margin-top: calc(40px * var(--k)); display: flex; align-items: center; gap: calc(16px * var(--k));
            font-size: calc(42px * var(--k)); font-weight: 700; padding: calc(16px * var(--k)) calc(34px * var(--k));
            border: 3px dashed rgba(255,211,77,.9); border-radius: 18px; background: rgba(255,188,0,.10);
            animation: up .55s cubic-bezier(.34,1.56,.64,1) 5.95s both; }
  .coupon svg { width: calc(52px * var(--k)); height: calc(52px * var(--k)); }

  /* scene C: the line-up */
  #sC { opacity: 0; justify-content: flex-start; padding-top: calc(54px * var(--k));
        animation: sceneIn .45s ease-out 8.45s both, sceneOut .45s ease-in 10.95s forwards; }
  #sC .title { font-size: calc(62px * var(--k)); font-weight: 700; animation: up .5s ease-out 8.5s both; }
  #sC .title b { color: var(--gold2); }
  .grid { margin-top: calc(26px * var(--k)); display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(18px * var(--k)) calc(14px * var(--k));
          width: calc(860px * var(--k)); }
  .card { display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
          background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.14); border-radius: 18px;
          padding: calc(14px * var(--k)) calc(8px * var(--k)) calc(14px * var(--k)); height: calc(300px * var(--k)); position: relative; }
  .card img { width: 92%; height: calc(190px * var(--k)); object-fit: contain; filter: drop-shadow(0 14px 16px rgba(0,0,0,.5)); }
  .card .nm { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: calc(32px * var(--k)); margin-top: calc(10px * var(--k)); }
  .card .tag { position: absolute; top: calc(10px * var(--k)); right: calc(10px * var(--k)); font-size: calc(24px * var(--k)); font-weight: 700;
               color: #071633; background: var(--gold2); border-radius: 8px; padding: 2px calc(10px * var(--k)); }

  /* scene D: call to action */
  #sD { opacity: 0; animation: sceneIn .5s cubic-bezier(.2,.8,.2,1) 11.3s both; }
  .dPct { font-weight: 700; font-size: calc(170px * var(--k)); line-height: 1.15; animation: pop .7s cubic-bezier(.34,1.56,.64,1) 11.3s both; }
  .dPct .w { color: #fff; -webkit-text-fill-color: #fff; }
  .dSub { font-size: calc(46px * var(--k)); font-weight: 700; color: var(--muted); animation: up .5s ease-out 11.5s both; }
  .btnWrap { margin-top: calc(44px * var(--k)); animation: up .55s cubic-bezier(.34,1.56,.64,1) 11.7s both; }
  .btn { font-size: calc(60px * var(--k)); font-weight: 700; padding: calc(22px * var(--k)) calc(74px * var(--k)); border-radius: 999px;
         background: linear-gradient(135deg, var(--blue), var(--cyan)); box-shadow: 0 0 0 0 rgba(0,198,255,.6), 0 18px 46px rgba(1,136,254,.6);
         animation: pulse 1.3s ease-in-out 12.3s infinite; }
  .url { font-size: calc(42px * var(--k)); font-weight: 600; margin-top: calc(26px * var(--k)); animation: up .5s ease-out 11.9s both; }
  .fine { font-size: calc(34px * var(--k)); color: var(--muted); margin-top: calc(14px * var(--k)); animation: up .5s ease-out 12.05s both; }
  .fine b { color: var(--gold2); }

  /* ---------- keyframes ---------- */
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes logoIn { from { opacity: 0; transform: translate(-50%, -24px) } to { opacity: 1; transform: translate(-50%, 0) } }
  @keyframes projIn { from { opacity: 0; transform: translate(-50%, 120px) } to { opacity: 1; transform: translate(-50%, 0) } }
  @keyframes flick { 0% { opacity: 0 } 18% { opacity: .75 } 30% { opacity: .15 } 46% { opacity: .9 } 60% { opacity: .5 } 100% { opacity: 1 } }
  @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .82 } }
  @keyframes glare { 0% { opacity: 0; transform: translateX(-40%) } 30% { opacity: 1 } 100% { opacity: 0; transform: translateX(40%) } }
  @keyframes up { from { opacity: 0; transform: translateY(calc(40px * var(--k))) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.55) } to { opacity: 1; transform: scale(1) } }
  @keyframes roll { from { transform: translateY(0) } to { transform: translateY(-83.333%) } }
  @keyframes shine { from { background-position: 100% 0 } to { background-position: 0 0 } }
  @keyframes sceneIn { from { opacity: 0; transform: translateY(calc(50px * var(--k))) } to { opacity: 1; transform: none } }
  @keyframes sceneOut { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(calc(-50px * var(--k))) } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(calc(50px * var(--k))) scale(.85) } to { opacity: 1; transform: none } }
  @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,198,255,.55), 0 18px 46px rgba(1,136,254,.6) }
                     50% { transform: scale(1.05); box-shadow: 0 0 0 calc(18px * var(--k)) rgba(0,198,255,0), 0 18px 46px rgba(1,136,254,.6) } }
  @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(var(--dx), var(--dy)) } }
  @keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: 1 } }
</style>
</head>
<body>
<div class="abs room"></div>
<div class="abs ambient"></div>
<div class="abs beam" id="beam"></div>
<div class="abs beamCore" id="beamCore"></div>
<div class="abs motes" id="motes"></div>

<div class="abs screenGlow" id="screenGlow"></div>
<div class="abs screen" id="screen">
  <div class="abs screenOn">
    <div class="abs grain"></div>
    <div class="abs glare"></div>

    <div class="abs scene" id="sA">
      <div class="pill">সব প্রজেক্টরে</div>
      <div class="pctWrap goldGlow">
        <!-- gold is set per glyph: a background-clip:text on the parent ignores the rolling column's transform -->
        <div class="pct"><span class="roll"><span class="col"><span class="gold">০</span><span class="gold">১</span><span class="gold">২</span><span class="gold">৩</span><span class="gold">৪</span><span class="gold">৫</span></span></span><span class="gold">%</span></div>
        <div class="abs shine">৫%</div>
      </div>
      <div class="off">ছাড়</div>
      <div class="limited">সীমিত সময়ের অফার</div>
    </div>

    <div class="abs scene" id="sB">
      <div class="eyebrow">অফার চলবে</div>
      <div class="dates"><span class="d gold goldGlow">৩ – ১০</span><span class="m">অক্টোবর</span></div>
      <div class="days">শনিবার থেকে শনিবার</div>
      <div class="coupon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffd34d" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M9.5 14.5l5-5M9.6 9.6h.01M14.4 14.4h.01" stroke-linecap="round"/></svg>
        চেকআউটে কুপন কোড ব্যবহার করুন
      </div>
    </div>

    <div class="abs scene" id="sC">
      <div class="title">সব মডেলে <b>৫% ছাড়</b></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="abs scene" id="sD">
      <div class="dPct gold goldGlow">৫% <span class="w">ছাড়</span></div>
      <div class="dSub">সব প্রজেক্টরে · ৩–১০ অক্টোবর</div>
      <div class="btnWrap"><div class="btn">এখনই অর্ডার করুন</div></div>
      <div class="url lat">aun-projector.com.bd</div>
      <div class="fine">চেকআউটে কুপন কোড দিন · <b>১ বছরের</b> অফিসিয়াল ওয়ারেন্টি</div>
    </div>
  </div>
</div>

<div class="abs lens" id="lens"></div>
<img class="abs proj" id="proj" src="assets/u002-pro-back.png" alt="">
<img class="abs logo" src="assets/aun-logo-white.png" alt="AUN">
<div class="abs vignette"></div>

<script>
  const fmt = new URLSearchParams(location.search).get('fmt') || '916';
  // layout per format — everything else is relative to these
  const L = {
    '916': { W: 1080, H: 1920, logoY: 120, logoH: 70, scr: [70, 290, 940, 900], projW: 560, projY: 1470, lensY: 1496, lensHalf: 62 },
    '45':  { W: 1080, H: 1350, logoY: 40,  logoH: 56, scr: [80, 128, 920, 760], projW: 420, projY: 1030, lensY: 1050, lensHalf: 48 },
    '11':  { W: 1080, H: 1080, logoY: 34,  logoH: 50, scr: [130, 104, 820, 640], projW: 380, projY: 840, lensY: 858, lensHalf: 42 },
  }[fmt];
  const R = document.documentElement.style;
  R.setProperty('--W', L.W + 'px'); R.setProperty('--H', L.H + 'px');
  R.setProperty('--logoY', L.logoY + 'px'); R.setProperty('--logoH', L.logoH + 'px');
  R.setProperty('--projW', L.projW + 'px'); R.setProperty('--projY', L.projY + 'px');
  const [sx, sy, sw, sh] = L.scr;
  R.setProperty('--k', (sh / 900).toFixed(4));
  R.setProperty('--glowY', ((sy + sh / 2) / L.H * 100).toFixed(1) + '%');
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  place(document.getElementById('screen'), sx, sy, sw, sh);
  place(document.getElementById('screenGlow'), sx, sy, sw, sh);
  // beam: from the projector's front edge (hidden lens) fanning out to the screen's corners
  const cx = L.W / 2, ly = L.lensY, lh = L.lensHalf;
  const poly = `polygon(${cx - lh}px ${ly}px, ${cx + lh}px ${ly}px, ${sx + sw}px ${sy + sh}px, ${sx + sw}px ${sy}px, ${sx}px ${sy}px, ${sx}px ${sy + sh}px)`;
  document.getElementById('beam').style.clipPath = poly;
  const core = `polygon(${cx - lh * .5}px ${ly}px, ${cx + lh * .5}px ${ly}px, ${sx + sw * .75}px ${sy + sh}px, ${sx + sw * .25}px ${sy + sh}px)`;
  document.getElementById('beamCore').style.clipPath = core;
  Object.assign(document.getElementById('lens').style, { top: ly + 'px' });

  // dust motes drifting in the beam (seeded, so every render is identical)
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const motes = document.getElementById('motes');
  for (let i = 0; i < 46; i++) {
    const v = rnd();                                  // 0 = lens, 1 = screen bottom
    const y = ly + (sy + sh - ly) * v;
    const half = lh + (sw / 2 - lh) * v;
    const x = cx + (rnd() * 2 - 1) * half * .9;
    const s = 2 + rnd() * 4;
    const m = document.createElement('div');
    m.className = 'abs mote';
    Object.assign(m.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px',
      '--dx': ((rnd() * 2 - 1) * 40) + 'px', '--dy': (-(40 + rnd() * 110)) + 'px' });
    const d1 = 3 + rnd() * 4, d2 = 1.2 + rnd() * 1.8;
    m.style.animation = `drift ${d1}s ease-in-out ${-rnd() * d1}s infinite alternate, twinkle ${d2}s ease-in-out ${-rnd() * d2}s infinite`;
    motes.appendChild(m);
  }

  // the line-up: every AUN projector, popping in one after another
  const models = [['u001-pro', 'U001 Pro'], ['u002-pro', 'U002 Pro'], ['a45-pro', 'A45 Pro'],
                  ['a32-pro', 'A32 Pro'], ['a004-pro', 'A004 Pro'], ['a005', 'A005']];
  const grid = document.getElementById('grid');
  models.forEach(([f, n], i) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<span class="tag">-৫%</span><img src="assets/${f}-front.png" alt=""><div class="nm">${n}</div>`;
    c.style.animation = `cardIn .55s cubic-bezier(.34,1.56,.64,1) ${8.65 + i * .11}s both`;
    grid.appendChild(c);
  });

  window.__DURATION = 14.0;
</script>
</body>
</html>
